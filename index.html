<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Gestiona clientes y notas en un solo lugar." />
    <link rel="icon" href="logoicono.ico" />
    <title>Vaporex | Gestión de clientes</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal">
        <a class="brand" href="#clientes" aria-label="Vaporex, inicio">
          <img class="brand-mark" src="logo.webp" alt="Vaporex" />
          <span>Vaporex<span class="brand-period"></span></span>
        </a>

        <div class="workspace-label">ESPACIO DE TRABAJO</div>
        <nav class="primary-nav" aria-label="Navegación principal">
          <button class="nav-link is-active" type="button" data-view="clients" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
            <span>Clientes</span>
            <span class="nav-count" id="nav-client-count">0</span>
          </button>
          <button class="nav-link" type="button" data-view="agenda" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18M8 14h3m-3 3h3m3-3h2m-2 3h2" /></svg>
            <span>Agenda</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="local-note"><span class="local-dot"></span>Datos guardados en este dispositivo</div>
          <div class="profile-chip">
            <span class="profile-avatar">T</span>
            <span>
              <strong>Tu espacio</strong>
              <small>Cuenta personal</small>
            </span>
          </div>
        </div>
      </aside>

      <main class="main-area" id="clientes">
        <header class="topbar">
          <div class="breadcrumbs">
            <span>Espacio de trabajo</span>
            <span class="crumb-slash">/</span>
            <strong id="page-crumb">Clientes</strong>
          </div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="button button-primary" id="add-client-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              <span>Nuevo Cliente</span>
            </button>
          </div>
        </header>

        <div class="page-content">
          <section class="page-heading">
            <div>
              <p class="eyebrow" id="page-eyebrow">RELACIONES</p>
              <h1 id="page-title">Clientes</h1>
            </div>
          </section>

          <section class="stats-row stats-row-single" id="client-stats" aria-label="Resumen de clientes">
            <article class="stat-block">
              <span class="stat-label">Total de clientes</span>
              <strong id="stat-total">0</strong>
            </article>
          </section>

          <section class="agenda-panel" id="agenda-panel" aria-label="Calendario de servicios" hidden>
            <div class="calendar-toolbar">
              <div class="calendar-month-heading">
                <h2 id="calendar-month-label"></h2>
                <p id="calendar-service-count"></p>
              </div>
              <div class="calendar-filter">
                <label>
                  <span>Mes y año</span>
                  <input id="calendar-month-filter" type="month" aria-label="Filtrar por mes y año" />
                </label>
                <button class="text-action" id="reset-calendar-month" type="button">Mes actual</button>
              </div>
              <div class="calendar-controls" aria-label="Cambiar mes del calendario">
                <button class="icon-button" type="button" data-calendar-month="-1" aria-label="Mes anterior"><span aria-hidden="true">‹</span></button>
                <button class="button button-quiet" type="button" data-calendar-today>Hoy</button>
                <button class="icon-button" type="button" data-calendar-month="1" aria-label="Mes siguiente"><span aria-hidden="true">›</span></button>
              </div>
            </div>
            <div class="calendar-grid" id="calendar-grid" aria-labelledby="calendar-month-label"></div>
            <p class="calendar-empty" id="calendar-empty" hidden></p>
          </section>

          <section class="workspace-grid" id="clients-workspace" aria-label="Gestión de relaciones">
            <section class="client-list-panel" aria-label="Lista de clientes">
              <div class="list-toolbar">
                <label class="search-box">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
                  <input id="search-input" type="search" placeholder="Buscar por nombre o empresa" autocomplete="off" />
                  <kbd>/</kbd>
                </label>
                <label class="filter-field">
                  <span>Agenda</span>
                  <select id="service-filter">
                    <option value="all">Todos</option>
                    <option value="today">Servicios de hoy</option>
                  </select>
                </label>
                <label class="filter-field">
                  <span>Zona</span>
                  <select id="zone-filter">
                    <option value="all">Todas</option>
                    <option value="Norte">Norte</option>
                    <option value="Centro">Centro</option>
                    <option value="Sur">Sur</option>
                    <option value="Este">Este</option>
                    <option value="Oeste">Oeste</option>
                    <option value="Sin zona">Sin zona</option>
                  </select>
                </label>
              </div>
              <div class="list-meta">
                <span id="list-heading">CLIENTES</span>
                <span id="list-result-count">0 resultados</span>
              </div>
              <div class="client-list" id="client-list" aria-live="polite"></div>
            </section>

            <section class="detail-panel" id="detail-panel" aria-label="Detalle del cliente" aria-live="polite"></section>
          </section>

          <footer class="page-footer">
            <span>VAPOREX <span class="footer-dot">/</span> GESTIÓN DE CLIENTES</span>
          </footer>
        </div>
      </main>
    </div>

    <dialog class="client-dialog" id="client-dialog" aria-labelledby="dialog-title">
      <form id="client-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">FICHA DE CLIENTE</p>
            <h2 id="dialog-title">Nuevo cliente</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog aria-label="Cerrar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12" /></svg>
          </button>
        </div>

        <input type="hidden" name="id" />
        <div class="form-grid">
          <label class="field field-full">
            <span>Nombre completo <b>*</b></span>
            <input name="name" required maxlength="80" placeholder="Ej. Lucía Fernández" />
          </label>
          <label class="field field-full">
            <span>Dirección / ubicación</span>
            <input name="company" maxlength="100" placeholder="Número de casa, edificio o dirección" />
          </label>
          <label class="field field-full">
            <span>URL de ubicación</span>
            <input name="locationUrl" type="url" maxlength="300" placeholder="https://maps.google.com/?q=..." />
          </label>
          <label class="field">
            <span>Zona</span>
            <select name="zone">
              <option value="Sin zona">Sin zona</option>
              <option value="Norte">Norte</option>
              <option value="Centro">Centro</option>
              <option value="Sur">Sur</option>
              <option value="Este">Este</option>
              <option value="Oeste">Oeste</option>
            </select>
          </label>
          <label class="field">
            <span>Correo electrónico</span>
            <input name="email" type="email" maxlength="120" placeholder="nombre@gmail.com" />
          </label>
          <label class="field">
            <span>Teléfono</span>
            <input name="phone" type="tel" maxlength="40" placeholder="+1 555 123 4567" />
          </label>
        </div>

        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-dialog>Cancelar</button>
          <button class="button button-primary" type="submit">Guardar cliente</button>
        </div>
      </form>
    </dialog>

    <dialog class="client-dialog" id="service-dialog" aria-labelledby="service-dialog-title">
      <form id="service-form">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">CONTROL DE VISITAS</p>
            <h2 id="service-dialog-title">Registrar servicio</h2>
          </div>
          <button class="icon-button" type="button" data-close-service-dialog aria-label="Cerrar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="form-grid">
          <label class="field field-full">
            <span>Fecha del servicio <b>*</b></span>
            <input name="date" type="date" required />
          </label>
          <label class="field field-full">
            <span>Hora del servicio <b>*</b></span>
            <input name="time" type="time" required />
          </label>
          <label class="field field-full">
            <span>Servicio <b>*</b></span>
            <select name="serviceType" required>
              <option value="Limpieza profunda">Limpieza profunda</option>
              <option value="Bote de agua">Bote de agua</option>
              <option value="Reparación tarjeta electrónica">Reparación tarjeta electrónica</option>
              <option value="Instalación de aires">Instalación de aires</option>
            </select>
          </label>
          <label class="field field-full" id="service-quantity-field">
            <span>Cantidad de aires acondicionados</span>
            <input name="quantity" type="number" min="0" step="1" inputmode="numeric" placeholder="Ej. 3" />
          </label>
        </div>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-close-service-dialog>Cancelar</button>
          <button class="button button-primary" type="submit">Registrar servicio</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
